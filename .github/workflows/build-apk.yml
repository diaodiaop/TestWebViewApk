name: Build TestAPP APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate Version
        id: version
        run: |
          echo "version_code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            -PVERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PVERSION_NAME=${{ steps.version.outputs.version_name }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/TestAPP-v${{ steps.version.outputs.version_name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestAPP-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/debug/TestAPP-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30
